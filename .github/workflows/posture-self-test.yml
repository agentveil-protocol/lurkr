name: posture-self-test
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AgentVeil Posture on self
        id: posture
        uses: agentveil-protocol/agentveil-posture@main
        with:
          path: "."
          output: posture-report.json

      - name: Show report
        run: cat posture-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: posture-report
          path: posture-report.json
