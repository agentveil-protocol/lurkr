name: lurkr-self-test
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Lurkr on self
        id: lurkr
        uses: agentveil-protocol/lurkr@main
        with:
          path: "."
          output: lurkr-report.json

      - name: Show report
        run: cat lurkr-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lurkr-report
          path: lurkr-report.json
