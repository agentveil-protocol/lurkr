name: AgentVeil Posture
description: Pre-deployment posture scan for risky AI agent capabilities
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Path to scan
    required: false
    default: "."
  output:
    description: Report output path
    required: false
    default: agentveil-posture-report.json
  format:
    description: Report format to write (json or sarif)
    required: false
    default: json

outputs:
  report:
    description: Path to the generated JSON report
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install agentveil-posture
      run: python -m pip install .
      shell: bash
      working-directory: ${{ github.action_path }}
    - id: scan
      name: Run posture scan
      run: |
        agentveil posture scan --path "${{ inputs.path }}" --output "${{ inputs.output }}" --format "${{ inputs.format }}"
        echo "report=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
      shell: bash
