name: Lurkr
description: Find risky AI agent capabilities before deployment.
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Path to scan
    required: false
    default: "."
  output:
    description: Report output path
    required: false
    default: lurkr-report.json
  format:
    description: Report format to write (json or sarif)
    required: false
    default: json
  fail-on:
    description: Fail when findings at or above this severity are present
    required: false
    default: ""

outputs:
  report:
    description: Path to the generated report
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install lurkr
      run: python -m pip install .
      shell: bash
      working-directory: ${{ github.action_path }}
    - id: scan
      name: Run Lurkr scan
      env:
        LURKR_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "report=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        fail_on_args=()
        if [ -n "$LURKR_FAIL_ON" ]; then
          fail_on_args=(--fail-on "$LURKR_FAIL_ON")
        fi
        lurkr scan --path "${{ inputs.path }}" --output "${{ inputs.output }}" --format "${{ inputs.format }}" "${fail_on_args[@]}"
      shell: bash
