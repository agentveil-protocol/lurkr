synthetic:
  - id: dangerous_github_project
    path: fixtures/dangerous_github_project
    kind: adversarial
    description: Workflow, identity, and manifest high-risk controls.
    expected_findings:
      bypass.direct_github_token: 1
      workflow.deploy_without_approval: 1
      workflow.pull_request_target_secrets_risk: 1
      identity.private_key_unencrypted: 1
      tool.shell_without_approval: 1
  - id: dangerous_shadow_capabilities
    path: fixtures/dangerous_shadow_capabilities
    kind: adversarial
    description: MCP declared-vs-imported shadow capabilities.
    expected_findings:
      agent.declared_vs_imported_delta: 2
  - id: dangerous_crewai_shadow
    path: fixtures/dangerous_crewai_shadow
    kind: adversarial
    description: CrewAI declared-vs-imported shadow capability.
    expected_findings:
      agent.declared_vs_imported_delta: 1
  - id: dangerous_credential_to_llm
    path: fixtures/dangerous_credential_to_llm
    kind: adversarial
    description: Credential-bearing value passed into LLM context.
    expected_findings:
      agent.credential_to_llm_context: 1
  - id: dangerous_dynamic_prompt
    path: fixtures/dangerous_dynamic_prompt
    kind: adversarial
    description: Function parameter interpolated directly into prompt template.
    expected_findings:
      agent.dynamic_prompt_from_user_input: 1
  - id: dangerous_mcp_external
    path: fixtures/dangerous_mcp_external
