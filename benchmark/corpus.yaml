  - id: dangerous_python_file_access_tool
    path: fixtures/dangerous_python_file_access_tool
    kind: adversarial
    description: Python tool exposes file mutation.
    expected_findings:
      agent.python_tool_without_approval: 1
      agent.python_unrestricted_file_access: 1
  - id: dangerous_python_api_key_literal
    path: fixtures/dangerous_python_api_key_literal
