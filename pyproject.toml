[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lurkr"
version = "0.4.0"
description = "Lurkr — local-only pre-deployment scanner for risky AI agent capabilities. No telemetry."
keywords = ["security", "agent", "mcp", "ai-agents", "github-actions", "static-analysis", "pre-deployment"]
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "AgentVeil Protocol contributors" }
]
dependencies = [
  "PyYAML>=6.0.1,<7",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-javascript>=0.25,<0.26"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security"
]

[project.scripts]
lurkr = "lurkr.cli:main"

[project.optional-dependencies]
test = [
  "jsonschema>=4.0",
  "pytest>=8"
]
validation = [
  "jsonschema>=4.0"
]

[project.urls]
Homepage = "https://agentveil.dev"
Repository = "https://github.com/agentveil-protocol/lurkr"
Issues = "https://github.com/agentveil-protocol/lurkr/issues"
Documentation = "https://github.com/agentveil-protocol/lurkr#readme"

[tool.setuptools.packages.find]
where = ["src"]
